# Metrics with timestamps outside the aggregation window are not aggregated
# and must therefore not be dropped by `drop_original` (issue #18257).
[agent]
    omit_hostname = true

[[inputs.file]]
    files = ["testcases/aggregators-drop-original-outside-window/input.influx"]
    data_format = "influx"

[[aggregators.minmax]]
    period = "1s"
    drop_original = true
